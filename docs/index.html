<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Loot</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b303a; --text: #e6e8ec;
    --dim: #9aa2b1; --accent: #6ea8ff;
    --q2: #1eff00; --q3: #0070dd; --q4: #a335ee; --q5: #ff8000;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px;
             background: var(--panel); border-bottom: 1px solid var(--line); }
  .f { display: flex; flex-direction: column; gap: 4px; }
  .f label { font-size: 11px; color: var(--dim); text-transform: uppercase; }
  select, input { background: #11131a; color: var(--text); border: 1px solid var(--line);
                  border-radius: 4px; padding: 5px 7px; font: inherit; }
  input[type=number] { width: 70px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); cursor: pointer;
       font-size: 12px; color: var(--dim); }
  th.sorted { color: var(--accent); }
  tbody tr:hover { background: #1a1d24; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .q2 { color: var(--q2); } .q3 { color: var(--q3); }
  .q4 { color: var(--q4); } .q5 { color: var(--q5); }
  .stats { white-space: normal; color: var(--dim); }
  .stats b { color: var(--text); font-weight: 600; }
  .src { color: var(--dim); font-size: 13px; }
  .src .zone { color: var(--accent); }
  #count { padding: 8px 16px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Forever Loot</h1>
  <div class="sub" id="meta">loading…</div>
</header>

<div class="filters">
  <div class="f"><label>Slot</label><select id="slot"></select></div>
  <div class="f"><label>Type</label><select id="type"></select></div>
  <div class="f"><label>Quality</label><select id="quality"></select></div>
  <div class="f"><label>Stat</label><select id="stat"></select></div>
  <div class="f"><label>Min</label><input type="number" id="statMin" value="0" min="0"></div>
  <div class="f"><label>Source</label><select id="source"></select></div>
  <div class="f"><label>Zone</label><select id="zone"></select></div>
  <div class="f"><label>Req level</label><input type="number" id="lvlMin" placeholder="min"></div>
  <div class="f"><label>&nbsp;</label><input type="number" id="lvlMax" placeholder="max"></div>
  <div class="f"><label>Name</label><input id="name" placeholder="search"></div>
</div>

<div id="count"></div>
<table>
  <thead><tr>
    <th data-key="name">Item</th>
    <th data-key="type">Type</th>
    <th data-key="ilvl">ilvl</th>
    <th data-key="reqLevel">Req</th>
    <th data-key="armor">Armor</th>
    <th data-key="_stats">Stats</th>
    <th data-key="_source">Source</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const SLOTS = {1:"Head",2:"Neck",3:"Shoulder",4:"Shirt",5:"Chest",6:"Waist",7:"Legs",8:"Feet",
  9:"Wrist",10:"Hands",11:"Finger",12:"Trinket",13:"One-Hand",14:"Shield",15:"Ranged",16:"Back",
  17:"Two-Hand",19:"Tabard",20:"Chest",21:"Main Hand",22:"Off Hand",23:"Held In Off-hand",
  25:"Thrown",26:"Ranged",28:"Relic"};

let items = [], sort = { key: "ilvl", dir: -1 };

const el = id => document.getElementById(id);
const opts = (sel, values, all = "Any") => {
  sel.innerHTML = `<option value="">${all}</option>` +
    values.map(v => `<option value="${v[0]}">${v[1]}</option>`).join("");
};

function statValue(item, stat) {
  return stat ? (item.stats[stat] || 0) : 0;
}

function matches(i) {
  const stat = el("stat").value, min = Number(el("statMin").value) || 0;
  if (el("slot").value && String(i.slot) !== el("slot").value) return false;
  if (el("type").value && i.type !== el("type").value) return false;
  if (el("quality").value && String(i.quality) !== el("quality").value) return false;
  if (stat && statValue(i, stat) < Math.max(min, 1)) return false;
  if (!stat && min) return false;
  if (el("source").value && !i.sources.some(s => s.kind === el("source").value)) return false;
  if (el("zone").value && !i.sources.some(s => s.zone === el("zone").value)) return false;
  const lo = el("lvlMin").value, hi = el("lvlMax").value;
  if (lo && i.reqLevel < Number(lo)) return false;
  if (hi && i.reqLevel > Number(hi)) return false;
  const q = el("name").value.trim().toLowerCase();
  if (q && !i.name.toLowerCase().includes(q)) return false;
  return true;
}

function sortKey(i) {
  if (sort.key === "_stats") return statValue(i, el("stat").value);
  if (sort.key === "_source") return (i.sources[0]?.zone || i.sources[0]?.kind || "~");
  return i[sort.key] ?? "";
}

function render() {
  const rows = items.filter(matches).sort((a, b) => {
    const x = sortKey(a), y = sortKey(b);
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir || a.name.localeCompare(b.name);
  });
  el("count").textContent = `${rows.length} of ${items.length} items`;
  el("rows").innerHTML = rows.map(i => `
    <tr>
      <td><a class="q${i.quality}" href="https://www.wowhead.com/forever/item=${i.id}"
             target="_blank" rel="noopener">${i.name}</a></td>
      <td>${i.type || ""}</td>
      <td>${i.ilvl ?? ""}</td>
      <td>${i.reqLevel || ""}</td>
      <td>${i.armor ?? ""}</td>
      <td class="stats">${Object.entries(i.stats)
          .map(([k, v]) => `<b>${v}</b> ${k}`).join(", ")}</td>
      <td class="src">${i.sources.map(s =>
          s.name ? `${s.name}${s.zone ? ` <span class="zone">(${s.zone})</span>` : ""}`
                 : s.kind).join(" · ") || "—"}</td>
    </tr>`).join("");
}

fetch("data/items.json").then(r => r.json()).then(data => {
  items = data;
  const uniq = (fn) => [...new Set(data.flatMap(fn).filter(Boolean))].sort();
  opts(el("slot"), [...new Set(data.map(i => i.slot))].sort((a, b) => a - b)
        .map(s => [s, SLOTS[s] || s]));
  opts(el("type"), uniq(i => [i.type]).map(t => [t, t]));
  opts(el("quality"), [[2, "Uncommon"], [3, "Rare"], [4, "Epic"], [5, "Legendary"]]);
  opts(el("stat"), uniq(i => Object.keys(i.stats)).map(s => [s, s]));
  opts(el("source"), uniq(i => i.sources.map(s => s.kind)).map(s => [s, s]));
  opts(el("zone"), uniq(i => i.sources.map(s => s.zone)).map(z => [z, z]));
  el("meta").textContent = `${items.length} items`;
  render();
});

document.querySelectorAll(".filters select, .filters input")
  .forEach(n => n.addEventListener("input", render));
document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  const key = th.dataset.key;
  sort = { key, dir: sort.key === key ? -sort.dir : (key === "name" ? 1 : -1) };
  document.querySelectorAll("th").forEach(t => t.classList.toggle("sorted", t === th));
  render();
}));
</script>
</body>
</html>
