<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Loot</title>
<script>var whTooltips = { colorLinks: false, iconizeLinks: true, renameLinks: false };</script>
<script src="https://wow.zamimg.com/js/tooltips.js"></script>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b303a; --text: #e6e8ec;
    --dim: #9aa2b1; --accent: #6ea8ff;
    --q2: #1eff00; --q3: #0070dd; --q4: #a335ee; --q5: #ff8000;
  }
  * { box-sizing: border-box; }
  /* the table area is the only thing that scrolls, so the header can stick to it */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  .bar { flex: none; }
  .dim { color: var(--dim); font-size: 12px; }
  button, select, input { background: #11131a; color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
         padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
          background: #11131a; border: 1px solid var(--line); border-radius: 12px;
          cursor: grab; user-select: none; }
  .chip.drag { opacity: .4; }
  .chip .x { color: var(--dim); }
  .chip .x:hover { color: var(--text); }

  .pop { position: relative; }
  .menu { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 210px;
          max-height: 60vh; overflow: auto; padding: 8px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 6px;
          box-shadow: 0 10px 28px #0008; }
  .menu.right { left: auto; right: 0; }
  .menu h4 { margin: 8px 0 4px; font-size: 11px; color: var(--dim);
             text-transform: uppercase; letter-spacing: .04em; }
  .menu label { display: flex; align-items: center; gap: 7px; padding: 3px 2px;
                text-align: left; white-space: nowrap; cursor: pointer; }
  .menu label .dim { margin-left: auto; padding-left: 12px; }
  .menu label:hover { color: var(--accent); }
  .hidden { display: none; }

  /* always-on track, so the thumb shows how much of the page is left */
  .wrap { flex: 1; min-height: 0; overflow: scroll;
          scrollbar-color: #5a647c #0f1116; }
  .wrap::-webkit-scrollbar { width: 14px; height: 14px; }
  .wrap::-webkit-scrollbar-track { background: #0f1116; }
  .wrap::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--line); }
  .wrap::-webkit-scrollbar-track:horizontal { border-top: 1px solid var(--line); }
  .wrap::-webkit-scrollbar-thumb { background: #5a647c; border-radius: 7px;
                                   border: 3px solid #0f1116; }
  .wrap::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .wrap::-webkit-scrollbar-corner { background: #0f1116; }
  /* columns hug their content; any leftover width stays at the right edge */
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--panel); z-index: 10;
             font-size: 12px; color: var(--dim); cursor: pointer; }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  thead tr.filters th { top: 27px; cursor: auto; font-weight: 400; z-index: 9; }
  thead tr.filters th > input { width: 100%; min-width: 60px; }
  .menu input[type=checkbox] { flex: none; width: 13px; height: 13px; margin: 0; }
  thead tr.filters .pop { display: inline-block; }
  thead tr.filters button.on { border-color: var(--accent); color: var(--accent); }
  .menu .range { display: flex; gap: 5px; margin-bottom: 8px; }
  .menu .range input { width: 80px; }
  .menu .clear { width: 100%; }
  td.num, th.num { text-align: right; }
  th.pad, td.pad { width: 100%; }   /* absorbs the leftover, keeping columns tight */
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--bg); z-index: 8; }
  thead th:first-child { background: var(--panel); z-index: 11; }
  tbody tr:hover td:first-child { background: #1a1d24; }
  tbody tr:hover { background: #1a1d24; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .q2 { color: var(--q2); } .q3 { color: var(--q3); }
  .q4 { color: var(--q4); } .q5 { color: var(--q5); }
  .zone { color: var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .pg { display: inline-flex; align-items: center; gap: 8px; }
  .pg button { padding: 4px 9px; }
</style>
</head>
<body>
<div class="bar">
  <div class="pop">
    <button id="colBtn">Columns ▾</button>
    <div class="menu hidden" id="colMenu"></div>
  </div>
  <span class="dim">Sort:</span>
  <span id="sortChips" class="dim">none</span>
  <div class="pop">
    <button id="sortBtn" title="Or click a column header">+ Add sort</button>
    <div class="menu hidden" id="sortMenu"></div>
  </div>
  <span class="sep"></span>
  <span class="pg">
    <button id="prev">◀</button>
    <span id="pageInfo" class="dim"></span>
    <button id="next">▶</button>
  </span>
  <label class="dim">Rows
    <select id="pageSize">
      <option>50</option><option selected>100</option><option>250</option><option>500</option>
    </select>
  </label>
  <span class="sep"></span>
  <button id="reset">Reset</button>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr id="head"></tr>
      <tr class="filters" id="filterRow"></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const SLOTS = {1:"Head",2:"Neck",3:"Shoulder",4:"Shirt",5:"Chest",6:"Waist",7:"Legs",8:"Feet",
  9:"Wrist",10:"Hands",11:"Finger",12:"Trinket",13:"One-Hand",14:"Shield",15:"Ranged",16:"Back",
  17:"Two-Hand",18:"Bag",19:"Tabard",21:"Main Hand",22:"Off Hand",23:"Held In Off-hand",
  24:"Ammo",25:"Thrown",26:"Ranged",28:"Relic"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let items = [], columns = [], byId = new Map();
let state = { cols: [], sort: [], filters: {}, page: 0, size: 100 };

/* ---------- column definitions ---------- */

function baseColumns() {
  return [
    { id: "name", label: "Item", group: "Item", type: "text", get: i => i.name,
      cell: i => `<a class="q${i.quality}" href="https://www.wowhead.com/forever/item=${i.id}"
                     data-wowhead="domain=forever" target="_blank" rel="noopener">${esc(i.name)}</a>` },
    { id: "armorType", label: "Armor type", group: "Item", type: "enum",
      get: i => i.armorType },
    { id: "slot", label: "Slot", group: "Item", type: "enum",
      get: i => SLOTS[i.slot] || i.slot },
    { id: "weaponType", label: "Weapon", group: "Item", type: "enum",
      get: i => i.weaponType },
    { id: "category", label: "Category", group: "Item", type: "enum",
      get: i => i.category },
    { id: "quality", label: "Quality", group: "Item", type: "enum", get: i => i.qualityName,
      cell: i => `<span class="q${i.quality}">${i.qualityName}</span>` },
    { id: "ilvl", label: "ilvl", group: "Item", type: "num", get: i => i.ilvl },
    { id: "reqLevel", label: "Req", group: "Item", type: "num", get: i => i.reqLevel || null },
    { id: "armor", label: "Armor", group: "Item", type: "num", get: i => i.armor ?? null },
    { id: "stats", label: "Stats", group: "Item", type: "text",
      get: i => Object.entries(i.stats).map(([k, v]) => `${v} ${k}`).join(", "),
      cell: i => Object.entries(i.stats).map(([k, v]) =>
        `<b>${v}</b> <span class="dim">${esc(k)}</span>`).join(", ") },
    { id: "source", label: "Source", group: "Source", type: "text",
      get: i => i.sources.map(s => s.name || s.kind).join(" · "),
      cell: i => i.sources.map(s => s.name
        ? `${esc(s.name)}${s.zone ? ` <span class="zone">(${esc(s.zone)})</span>` : ""}`
        : esc(s.kind)).join(" · ") || "—" },
    { id: "sourceKind", label: "Obtained", group: "Source", type: "enum",
      get: i => i.sources.map(s => s.kind).filter(Boolean)[0] || null,
      all: i => i.sources.map(s => s.kind).filter(Boolean) },
    { id: "zone", label: "Zone", group: "Source", type: "enum",
      get: i => i.sources.map(s => s.zone).filter(Boolean)[0] || null,
      all: i => i.sources.map(s => s.zone).filter(Boolean) },
  ];
}

function statColumns(data) {
  const names = new Set();
  data.forEach(i => Object.keys(i.stats).forEach(s => names.add(s)));
  return [...names].sort().map(stat => ({
    id: `stat:${stat}`, label: stat, group: "Stats", type: "num",
    get: i => i.stats[stat] ?? null,
  }));
}

const col = id => columns.find(c => c.id === id);

/* ---------- filtering, sorting ---------- */

function passes(item, c) {
  const f = state.filters[c.id];
  if (!f) return true;
  if (c.type === "num") {
    const v = c.get(item);
    if (f.min != null && (v == null || v < f.min)) return false;
    if (f.max != null && (v == null || v > f.max)) return false;
    return true;
  }
  if (c.type === "enum") {
    if (!f.length) return true;
    const values = c.all ? c.all(item) : [c.get(item)];
    return values.some(v => f.includes(String(v)));
  }
  return String(c.get(item) ?? "").toLowerCase().includes(String(f).toLowerCase());
}

function filtered() {
  const active = columns.filter(c => state.filters[c.id] !== undefined);
  return items.filter(i => active.every(c => passes(i, c)));
}

function compare(a, b) {
  for (const { id, dir } of state.sort) {
    const c = col(id);
    if (!c) continue;
    let x = c.get(a), y = c.get(b);
    if (x == null && y == null) continue;
    if (x == null) return 1;              // missing values always sink
    if (y == null) return -1;
    if (typeof x === "string" || typeof y === "string") {
      const r = String(x).localeCompare(String(y));
      if (r) return r * dir;
    } else if (x !== y) {
      return (x - y) * dir;
    }
  }
  return a.name.localeCompare(b.name);
}

/* ---------- state helpers ---------- */

const GROUP_ORDER = ["Item", "Stats", "Source"];

function showColumn(id) {
  if (!state.cols.includes(id)) {
    const order = [...columns]
      .sort((a, b) => GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group))
      .map(c => c.id);
    state.cols = [...state.cols, id].sort((p, q) => order.indexOf(p) - order.indexOf(q));
  }
}

// clicking a column cycles it through the sort: off -> default -> reversed -> off,
// appending to whatever is already sorted rather than replacing it
function toggleSort(id) {
  const first = col(id).type === "num" ? -1 : 1;   // numbers high first, names A-Z
  const at = state.sort.findIndex(s => s.id === id);
  if (at === -1) state.sort = [...state.sort, { id, dir: first }];
  else if (state.sort[at].dir === first) state.sort[at] = { id, dir: -first };
  else state.sort.splice(at, 1);
  if (state.sort.some(s => s.id === id)) showColumn(id);
  state.page = 0;
  sync();
}

function setFilter(id, value) {
  const empty = value == null || value === "" ||
    (Array.isArray(value) && !value.length) ||
    (typeof value === "object" && !Array.isArray(value) && value.min == null && value.max == null);
  if (empty) delete state.filters[id];
  else { state.filters[id] = value; showColumn(id); }
  state.page = 0;
  sync();
}

/* ---------- url ---------- */

function toUrl() {
  const p = new URLSearchParams();
  p.set("c", state.cols.join(","));
  if (state.sort.length) p.set("s", state.sort.map(s => `${s.id}:${s.dir}`).join(","));
  if (Object.keys(state.filters).length) p.set("f", JSON.stringify(state.filters));
  if (state.size !== 100) p.set("n", state.size);
  if (state.page) p.set("p", state.page + 1);
  history.replaceState(null, "", `?${p}`);
}

function fromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get("c")) state.cols = p.get("c").split(",").filter(id => col(id));
  if (p.get("s")) state.sort = p.get("s").split(",").map(s => {
    const cut = s.lastIndexOf(":");            // stat ids contain a colon
    const id = s.slice(0, cut);
    return col(id) ? { id, dir: Number(s.slice(cut + 1)) } : null;
  }).filter(Boolean);
  if (p.get("f")) { try { state.filters = JSON.parse(p.get("f")); } catch {} }
  if (p.get("n")) state.size = Number(p.get("n"));
  if (p.get("p")) state.page = Number(p.get("p")) - 1;
}

/* ---------- rendering ---------- */

function renderColumnMenu() {
  const menu = document.getElementById("colMenu");
  const groups = [...new Set(columns.map(c => c.group))];
  menu.innerHTML = groups.map(g => `<h4>${g}</h4>` + columns.filter(c => c.group === g)
    .map(c => `<label><input type="checkbox" data-col="${c.id}"
       ${state.cols.includes(c.id) ? "checked" : ""}> ${esc(c.label)}</label>`).join("")).join("");
  menu.querySelectorAll("input").forEach(box => box.addEventListener("change", () => {
    const id = box.dataset.col;
    if (box.checked) showColumn(id);
    else {
      state.cols = state.cols.filter(c => c !== id);
      state.sort = state.sort.filter(s => s.id !== id);
      delete state.filters[id];
    }
    sync();
  }));
}

function renderSortMenu() {
  const menu = document.getElementById("sortMenu");
  const groups = [...new Set(columns.map(c => c.group))];
  menu.innerHTML = `<div class="dim" style="padding:2px 2px 6px">adds after the current sort</div>` +
    groups.map(g => `<h4>${g}</h4>` + columns.filter(c => c.group === g)
      .filter(c => !state.sort.some(s => s.id === c.id))
      .map(c => `<label data-sort="${c.id}">${esc(c.label)}</label>`).join("")).join("");
  menu.querySelectorAll("[data-sort]").forEach(row => row.addEventListener("click", () => {
    closeMenus();
    toggleSort(row.dataset.sort);
  }));
}

function renderSortChips() {
  const host = document.getElementById("sortChips");
  if (!state.sort.length) { host.textContent = "none"; return; }
  host.innerHTML = state.sort.map((s, n) =>
    `${n ? '<span class="dim">then</span> ' : ""}<span class="chip" draggable="true" data-n="${n}">${esc(col(s.id).label)}
       ${s.dir < 0 ? "↓" : "↑"} <span class="x" data-x="${n}">✕</span></span>`).join(" ");
  host.querySelectorAll(".chip").forEach(chip => {
    const n = Number(chip.dataset.n);
    chip.addEventListener("click", e => {
      if (e.target.dataset.x !== undefined) state.sort.splice(n, 1);
      else state.sort[n] = { ...state.sort[n], dir: -state.sort[n].dir };
      sync();
    });
    chip.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", n); chip.classList.add("drag");
    });
    chip.addEventListener("dragend", () => chip.classList.remove("drag"));
    chip.addEventListener("dragover", e => e.preventDefault());
    chip.addEventListener("drop", e => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData("text/plain"));
      const [moved] = state.sort.splice(from, 1);
      state.sort.splice(n, 0, moved);
      sync();
    });
  });
}

function enumValues(c) {
  const seen = new Map();
  items.forEach(i => (c.all ? c.all(i) : [c.get(i)]).forEach(v => {
    if (v != null && v !== "") seen.set(String(v), (seen.get(String(v)) || 0) + 1);
  }));
  return [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

// numbers and short enums hug their content; long text columns take the rest
const cls = c => c.type === "num" ? "num" : "";

function renderHead() {
  const cols = state.cols.map(col);
  document.getElementById("head").innerHTML = cols.map(c => {
    const at = state.sort.findIndex(s => s.id === c.id);
    const mark = at === -1 ? "" :
      ` ${state.sort[at].dir < 0 ? "↓" : "↑"}${state.sort.length > 1 ? `<sup>${at + 1}</sup>` : ""}`;
    return `<th data-col="${c.id}" class="${cls(c)}${at > -1 ? " sorted" : ""}">
              ${esc(c.label)}${mark}</th>`;
  }).join("") + `<th class="pad"></th>`;
  document.querySelectorAll("#head th").forEach(th =>
    th.addEventListener("click", () => toggleSort(th.dataset.col)));

  document.getElementById("filterRow").innerHTML = cols.map(c => {
    const f = state.filters[c.id];
    if (c.type === "num") {
      const label = !f ? "Any"
        : f.min != null && f.max != null ? `${f.min}–${f.max}`
        : f.min != null ? `≥ ${f.min}` : `≤ ${f.max}`;
      return `<th class="num"><div class="pop">
        <button data-range="${c.id}" class="${f ? "on" : ""}">${label} ▾</button>
        <div class="menu right hidden"></div></div></th>`;
    }
    if (c.type === "enum") {
      const chosen = (f || []).length;
      return `<th><div class="pop">
        <button data-enum="${c.id}">${chosen ? `${chosen} selected` : "Any"} ▾</button>
        <div class="menu hidden"></div></div></th>`;
    }
    return `<th><input placeholder="contains" data-text="${c.id}" value="${esc(f ?? "")}"></th>`;
  }).join("") + `<th class="pad"></th>`;

  document.querySelectorAll("#filterRow [data-range]").forEach(button =>
    button.addEventListener("click", e => {
      e.stopPropagation();
      const id = button.dataset.range, menu = button.nextElementSibling;
      const f = state.filters[id] || {};
      menu.innerHTML = `<div class="range">
          <input type="number" placeholder="min" value="${f.min ?? ""}">
          <input type="number" placeholder="max" value="${f.max ?? ""}">
        </div>
        <button class="clear">Clear</button>`;
      const [lo, hi] = menu.querySelectorAll("input");
      const apply = () => setFilter(id, { min: lo.value === "" ? null : Number(lo.value),
                                          max: hi.value === "" ? null : Number(hi.value) });
      menu.querySelectorAll("input").forEach(x => {
        x.addEventListener("change", apply);
        x.addEventListener("keydown", ev => { if (ev.key === "Enter") apply(); });
      });
      menu.querySelector(".clear").addEventListener("click", () => setFilter(id, null));
      closeMenus(menu);
      menu.classList.toggle("hidden");
      lo.focus();
    }));
  document.querySelectorAll("#filterRow [data-text]").forEach(input => {
    let t; input.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => setFilter(input.dataset.text, input.value.trim()), 200);
    });
  });
  document.querySelectorAll("#filterRow [data-enum]").forEach(button =>
    button.addEventListener("click", e => {
      e.stopPropagation();
      const c = col(button.dataset.enum), menu = button.nextElementSibling;
      const chosen = state.filters[c.id] || [];
      menu.innerHTML = enumValues(c).map(([v, n]) =>
        `<label><input type="checkbox" value="${esc(v)}"
           ${chosen.includes(v) ? "checked" : ""}> ${esc(v)} <span class="dim">${n}</span></label>`)
        .join("") || `<span class="dim">no values</span>`;
      menu.querySelectorAll("input").forEach(box => box.addEventListener("change", () =>
        setFilter(c.id, [...menu.querySelectorAll("input:checked")].map(x => x.value))));
      closeMenus(menu);
      menu.classList.toggle("hidden");
    }));
}

function render() {
  const rows = filtered().sort(compare);
  const pages = Math.max(1, Math.ceil(rows.length / state.size));
  state.page = Math.min(state.page, pages - 1);
  const page = rows.slice(state.page * state.size, (state.page + 1) * state.size);
  const cols = state.cols.map(col);

  document.getElementById("rows").innerHTML = page.map(i => "<tr>" + cols.map(c => {
    const v = c.cell ? c.cell(i) : esc(c.get(i) ?? "");
    return `<td class="${cls(c)}">${v}</td>`;
  }).join("") + `<td class="pad"></td></tr>`).join("");

  document.getElementById("pageInfo").textContent =
    `${rows.length.toLocaleString()} items · page ${state.page + 1} of ${pages}`;
  document.getElementById("prev").disabled = state.page === 0;
  document.getElementById("next").disabled = state.page >= pages - 1;
  if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function sync() {
  renderColumnMenu();
  renderSortMenu();
  renderSortChips();
  renderHead();
  render();
  toUrl();
}

function closeMenus(except) {
  document.querySelectorAll(".menu").forEach(m => { if (m !== except) m.classList.add("hidden"); });
}

/* ---------- boot ---------- */

fetch("data/items.json").then(r => r.json()).then(data => {
  items = data;
  items.forEach(i => byId.set(i.id, i));
  columns = [...baseColumns(), ...statColumns(data)];
  state.cols = ["name", "armorType", "slot", "ilvl", "reqLevel", "stats", "source"];
  state.sort = [{ id: "ilvl", dir: -1 }];
  fromUrl();
  sync();
});

document.getElementById("sortBtn").addEventListener("click", e => {
  e.stopPropagation();
  const menu = document.getElementById("sortMenu");
  closeMenus(menu);
  menu.classList.toggle("hidden");
});
document.getElementById("colBtn").addEventListener("click", e => {
  e.stopPropagation();
  const menu = document.getElementById("colMenu");
  closeMenus(menu);
  menu.classList.toggle("hidden");
});
document.addEventListener("click", () => closeMenus());
document.querySelectorAll(".menu").forEach(m => m.addEventListener("click", e => e.stopPropagation()));
document.getElementById("prev").addEventListener("click", () => { state.page--; render(); toUrl(); });
document.getElementById("next").addEventListener("click", () => { state.page++; render(); toUrl(); });
document.getElementById("pageSize").addEventListener("change", e => {
  state.size = Number(e.target.value); state.page = 0; render(); toUrl();
});
document.getElementById("reset").addEventListener("click", () => {
  location.search = "";
});
</script>
</body>
</html>
